                content: "<p> <b> Marmaraspor Kulüp Başkanı Fikri Belali, kulübün mevcut durumu ve geleceğe yönelik planlamalar hakkında açıklamalarda bulundu. </b> </p> <br> <p> Başkan Belali, yapılan eleştirilere ilişkin olarak, <b> <strong> “Vedat Hesaplı’nın sözlerini dikkate almıyorum. Tüm enerjimi, doğru kararlar alarak Marmaraspor’un başarısını sağlayacak planlar üzerinde yoğunlaştırıyorum,” </b> </strong> ifadelerini kullandı. </p> <br> <p> Açıklamalarında taraftar desteğine de değinen Belali, <br> <strong> “Taraftarlarımızın ve kamuoyumuzun desteğini hissetmekten mutluluk duyuyorum. Bu destek, hedeflerimize ulaşma yolunda bizim için önemli bir motivasyon kaynağıdır,” </br> </strong> dedi </p> <br> <p> Kulübün mali ve idari yapısına ilişkin değerlendirmelerde bulunan Fikri Belali, Marmaraspor’un kaynaklarının kulübün menfaatleri doğrultusunda kullanılmaya devam edeceğini vurgulayarak, <b> <strong> “Marmaraspor’daki tüm kaynakları gerektiği şekilde kullanmayı sürdürecek, takımımızı daha üst hedeflere taşımak için çalışmalarımıza kararlılıkla devam edeceğiz,” </b> </strong> şeklinde konuştu. </p>  ",

            {
                id: 8,
                title: "Başkan Adayı Vedat Hesaplı: “Marmaraspor’da Şeffaf ve Taraftar Odaklı Bir Dönem Başlatacağız”",
                date: "2025-11-22",
                category: "Kulüp",
                summary: "Marmaraspor Başkan Adayı Vedat Hesaplı, yaklaşan seçim süreci, mevcut yönetim, mali yapı, transfer politikası ve kulübün geleceğine dair projeleri hakkında açıklamalarda bulundu.",
               content: "<p>Soru: <b><strong>Seçim yaklaşıyor başkanım. Vaatleriniz ve Marmaraspor’un mevcut başkanı Fikri Belali hakkında neler söylemek istersiniz?</strong></b><br><br></p><p>Vedat Hesaplı: <b><strong>Fikri Belali’nin başarısızlığı ortada. Kulübü ciddi bir borç yükünün altına soktu ve bu durumu yıldız transferlerle örtmeye çalıştı. Ancak sonuçlar bunu gizleyemiyor. Bizim vizyonumuz tamamen farklı. Taraftar odaklı, şeffaf ve hesap verebilir bir yönetim anlayışıyla Marmaraspor’u yönetmek istiyoruz.</strong></b><br><br></p><p>Soru: <b><strong>Peki siz ne yapacaksınız?</strong></b><br><br></p><p>Vedat Hesaplı: <b><strong>Şeffaflaşma ilk adımımız olacak. Üyelerin ve kamuoyunun bilgilendirilmesi, kulüp hesaplarının denetlenmesi önceliğimiz. Belali’nin yaptığı gibi star transferler yerine takımımızın ihtiyacına uygun, genç ve yetenekli sporcuları bünyemize katacağız.</strong></b><br><br></p><p>Soru: <b><strong>Artishking ile Ambatukam’ın yeni sözleşmesini gördünüz mü? Ne düşünüyorsunuz? Sizce de çok büyük paralar değil mi?</strong></b><br><br></p><p>Vedat Hesaplı: <b><strong>Evet, sözleşme detaylarına baktım. Bence rakamlar biraz abartılı. Özellikle Ambatukam’ın sözleşmesi dikkatimi çekti. Kulübün kaynaklarını akılcı bir şekilde kullanması gerekiyor.</strong></b><br><br></p><p>Soru: <b><strong>Siz başkan seçildiğinizde ne yapacaksınız?</strong></b><br><br></p><p>Vedat Hesaplı: <b><strong>Öncelikle kulübün iç yapılarını iyileştireceğim. Üyelerle ve taraftarlarla ortak bir noktada buluşacağım. Şeffaf bir şekilde hesap vereceğim. Gösterişçi adımlar yerine, takımımızın temel ihtiyaçlarını karşılayacak kararlar vereceğim.</strong></b><br><br></p><p>Soru: <b><strong>Son olarak, MarmaraStore için ne yapacaksınız ve stadyum için bir şeyler yapacak mısınız? Stadyum oldukça eski ve bakımsız görünüyor.</strong></b><br><br></p><p>Vedat Hesaplı: <b><strong>Stadyumun bakımını üstleneceğim ve yenilemeyi de planlıyorum. Tribünleri modernize edeceğim, seyirci memnuniyetini artıracağım. MarmaraStore için de düzenleme yapacağım; taraftarlarımızın ihtiyaç duyacağı daha fazla ürün çeşidi sunacağım.</strong></b><br><br></p>",
                image: "https://i.hizliresim.com/z0zhl60.png"
            },

            {
                id: 9,
                title: "Başkan Fikri Belali’den Seçim Süreci ve Kulübün Geleceğine Dair Açıklamalar",
                date: "2025-11-23",

               summary: "Marmaraspor Kulüp Başkanı Fikri Belali, yaklaşan başkanlık seçimleri öncesinde rakibi Vedat Hesaplı, taraftar beklentileri, MarmaraStore fiyatları, stadyum projeleri ve kulübün geleceğine yönelik hedefleri hakkında değerlendirmelerde bulundu.",
                content: "<p>Soru: <b><strong>Seçim yaklaşıyor başkanım. Vaatleriniz ve Marmaraspor’un başkan adayı Vedat Hesaplı için neler söylemek istersiniz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Vedat Hesaplı bir amatör. Marmaraspor’un hak etmediği biri. Bizim gibi büyük bir kulübü bu kadar basite indirmesini kabul edemem.</strong></b><br><br></p><p>Soru: <b><strong>Taraftara neler vaat ediyorsunuz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Taraftardan tek bir şey istiyorum: Bizi dinlesinler. Biz, Marmaraspor için doğru olan her şeyi yapmaya hazırız. Ayrıca taraftarlarımızın kulübe ne kadar sahip çıkacağını görmek istiyoruz. Biz bir aileyiz ve hep birlikte başarılı olacağız.</strong></b><br><br></p><p>Soru: <b><strong>Taraftarlar MarmaraStore fiyatlarından şikâyetçi. Çok pahalı olduğunu söylüyorlar. Bu konuda ne diyeceksiniz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Evet, bunun farkındayız ve bu durum bizi de rahatsız ediyor. Taraftarlarımıza en iyi alışveriş deneyimini sunmak istiyoruz ancak bazı dış etkenler fiyatları etkiliyor. Korkarım ki bu durum sadece başlangıç.</strong></b><br><br></p><p>Soru: <b><strong>Ne gibi dış etkenlerden bahsediyorsunuz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Ekonomi, vergi oranları, döviz kurlarındaki artış ve benzeri faktörler maliyetleri doğrudan etkiliyor. Bu durum fiyatlara yansıyor.</strong></b><br><br></p><p>Soru: <b><strong>Stadyumun oldukça eski olduğu söyleniyor. Yenilemeyi düşünüyor musunuz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Evet, kesinlikle yeni bir stadyuma ihtiyacımız var. Mevcut stadyumumuz günümüz şartları için yeterli değil. Yeni bir stadyum yapmak bizim için bir hayal değil, gerçekleştirmeyi planladığımız bir projedir.</strong></b><br><br></p><p>Soru: <b><strong>Artishking ve Ambatukam’ın sözleşmeleri neden bu kadar yüksek? Yaşları da göz önüne alındığında eleştiriler var.</strong></b><br><br></p><p>Fikri Belali: <b><strong>Bu oyuncular bizim için çok önemli. Yaşları yüksek olabilir ancak sahada hâlâ üst düzey katkı sağlıyorlar. Tecrübeleri ve yetenekleri tartışılmaz. Bu nedenle sözleşmeleri bu seviyede.</strong></b><br><br></p><p>Soru: <b><strong>Tekrar başkan seçilirseniz hangi projeleri hayata geçireceksiniz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Önceliğim kulübün finansal yapısını daha da güçlendirmek olacak. Mevcut sponsorlukları geliştirmek ve yeni sponsorlarla anlaşmalar yapmak istiyoruz. İkinci olarak altyapımıza yatırım yapacağız. Genç yeteneklerin gelişimi sadece kulübümüz için değil, ülke futbolu için de çok önemli.</strong></b><br><br></p><p>Soru: <b><strong>Son olarak, rakibiniz sizi kulübü batırmakla suçluyor ve bazı taraftarlar istifa çağrıları yapıyor. Ne söylemek istersiniz?</strong></b><br><br></p><p>Fikri Belali: <b><strong>Bu tamamen bir saçmalık. Yıllardır Marmaraspor’u ayakta tutmak için çalışıyorum. Vedat Hesaplı ise somut bir plan ortaya koymadan konuşuyor. Taraftarlarımız bu tür söylemlere prim vermemeli.</strong></b><br><br></p>",

                image: "https://i.hizliresim.com/glkjcik.png"
            },
            {
                id: 17,
                title: "Marmaraspor’dan Büyük Sponsorluk Anlaşması!",
                date: "2026-04-01",
                category: "Kulüp",
                summary: "Marmaraspor Başkanı Fikri Belali, kulübün yeni sezon sponsorlarını açıkladı. İki büyük marka ile önemli gelir anlaşmaları yapıldı.",
                content:"Marmaraspor Başkanı Sayın Fikri Belali, kulübün yeni dönem sponsorlarını kamuoyuna duyurdu. Yapılan anlaşmaya göre Yemeksepeti ve Burger King, Marmaraspor’un resmi sponsorları arasında yer aldı. <br> Sözleşme kapsamında Yemeksepeti’nden yıllık 6 milyon, Burger King’ten ise yıllık 5 milyon gelir elde edileceği açıklandı. Bu anlaşmaların kulübün mali yapısına büyük katkı sağlaması bekleniyor.",
                image:"https://artishh.github.io/MarmarasporTR/kulup/haber/Resim/Baskan.jpg"
            },
             {
                id: 18,
                title: "",
                date: "",
                category: "Kulüp",
                summary: "",
                content:"",
                image:""
            },
            
        ];

        // --- GLOBAL DEĞİŞKENLER ---
        let currentFilter = 'all';
        let currentPage = 1;
        const itemsPerPage = 6;
        let filteredNews = [];

        // --- MODAL (POPUP) FONKSİYONLARI ---
        const modal = document.getElementById('news-modal');
        
        function openModal(newsId) {
            const newsItem = newsData.find(item => item.id === newsId);
            if (!newsItem) return;

            document.getElementById('modal-image').src = newsItem.image;
            document.getElementById('modal-title').innerText = newsItem.title;
            document.getElementById('modal-category').innerText = newsItem.category;
            
            // Tarih Formatlama
            const dateObj = new Date(newsItem.date);
            const formattedDate = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('modal-date').innerHTML = `<i data-lucide="calendar" class="w-4 h-4 text-gold-500"></i> ${formattedDate}`;
            
            document.getElementById('modal-content').innerHTML = newsItem.content;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Arka plan scrollu engelle
            lucide.createIcons(); // Modal içindeki ikonları oluştur
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; // Scrollu geri aç
        }

        // ESC tuşu ile modal kapatma
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });

        // --- HABER FİLTRELEME VE SIRALAMA ---
        function setFilter(category) {
            currentFilter = category;
            currentPage = 1; // Filtre değişince sayfa 1'e dön
            updateFilterButtons();
            renderApp();
        }

        function updateFilterButtons() {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => {
                const btnCategory = btn.innerText === "Tümü" ? "all" : btn.innerText;
                if (btnCategory === currentFilter || (currentFilter === 'all' && btnCategory === 'Tümü')) {
                    btn.classList.add('active', 'border-gold-500/50', 'text-gold-400', 'bg-gold-500/10');
                    btn.classList.remove('border-gray-700', 'text-gray-400');
                } else {
                    btn.classList.remove('active', 'border-gold-500/50', 'text-gold-400', 'bg-gold-500/10');
                    btn.classList.add('border-gray-700', 'text-gray-400');
                }
            });
        }

        // --- RENDER (EKRANA ÇİZME) MANTIĞI ---
        function renderApp() {
            // 1. Filtrele
            let tempNews = newsData;
            if (currentFilter !== 'all') {
                tempNews = newsData.filter(item => item.category === currentFilter);
            }

            // 2. Sırala (En Yeni En Üstte)
            tempNews.sort((a, b) => new Date(b.date) - new Date(a.date));
            filteredNews = tempNews;

            // 3. Manşet ve Grid Ayrımı
            // Eğer filtrelenmiş haber varsa, en yenisini Manşet yap, kalanları Grid yap.
            const featuredContainer = document.getElementById('featured-news-container');
            const gridContainer = document.getElementById('news-grid');
            
            featuredContainer.innerHTML = '';
            gridContainer.innerHTML = '';

            if (filteredNews.length === 0) {
                gridContainer.innerHTML = '<p class="text-center text-gray-500 col-span-3">Bu kategoride haber bulunmamaktadır.</p>';
                document.getElementById('pagination-controls').innerHTML = '';
                return;
            }

            // En güncel haberi al (Manşet)
            // NOT: Sayfalama mantığında manşet hep sabit en yeni kalabilir veya
            // sayfalama manşeti de etkileyebilir. Kullanıcı "page 2'de farklı haberler" dediği için
            // Manşet alanını "En Son Haber" olarak sabit tutalım, alt tarafı sayfalayalım.
            // VEYA tüm listeyi sayfalayalım. Kullanıcı deneyimi açısından en iyisi:
            // Manşet = Listenin 0. elemanı.
            // Grid = Listenin geri kalanı.
            
            // Kullanıcı isteğine göre: "2025 aralık page 1, ekim page 2". 
            // Yani tüm liste sayfalara bölünmeli.
            // Biz Manşet alanına o anki sayfanın ilk haberini koyabiliriz ya da 
            // Manşet'i global en yeni yapıp, gridi sayfalayabiliriz.
            // Basitlik ve "Page 2 farklı haber" isteği için:
            // Manşet'i SADECE 1. Sayfada gösterelim. Diğer sayfalarda sadece grid olsun veya
            // Manşet alanı her zaman en yeni haber olsun, grid sayfalansın.
            
            // Karar: Manşet alanı her zaman "Filtrenin En Yenisi" olsun (sabit).
            // Grid alanı ise Geriye kalanları sayfalasın (slice 1'den başlar).
            // Bu sayede Page 1 ve Page 2 grid içerikleri tamamen farklı olur.

            const featuredNews = filteredNews[0];
            const remainingNews = filteredNews.slice(1); // Manşet hariç diğerleri

            // Manşeti Renderla
            renderFeatured(featuredNews);

            // Sayfalama Hesaplamaları (Kalan haberler üzerinden)
            const totalItems = remainingNews.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            
            // Geçerli sayfa kontrolü
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = remainingNews.slice(start, end);

            // Grid Renderla
            renderGrid(pageItems);

            // Pagination Renderla
            renderPagination(totalPages);
            
            lucide.createIcons();
        }

        function renderFeatured(news) {
            const container = document.getElementById('featured-news-container');
            const dateObj = new Date(news.date);
            const formattedDate = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

            const html = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center group cursor-pointer" onclick="openModal(${news.id})">
                    <div class="relative overflow-hidden rounded-xl border border-gold-500/20 group h-[400px] shadow-glow">
                        <img src="${news.image}" alt="${news.title}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
                        <div class="absolute top-4 left-4 bg-gold-500 text-onyx-900 text-xs font-black px-3 py-1 uppercase tracking-wider">Son Dakika</div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-4 text-gray-400 text-sm">
                            <i data-lucide="calendar" class="w-4 h-4 text-gold-500"></i>
                            <span>${formattedDate}</span>
                            <span class="w-1 h-1 bg-gray-600 rounded-full"></span>
                            <span class="text-gold-400 uppercase tracking-wider font-bold text-xs">${news.category}</span>
                        </div>
                        <h2 class="font-heading text-3xl md:text-5xl font-black text-gray-100 mb-6 leading-tight group-hover:text-gold-500 transition-colors">
                            ${news.title}
                        </h2>
                        <p class="text-gray-400 text-lg mb-8 font-light border-l-2 border-gray-700 pl-4">
                            ${news.summary}
                        </p>
                        <button class="inline-flex items-center gap-2 text-gold-500 font-bold tracking-widest uppercase hover:text-white transition-colors group/btn">
                            Haberi Oku
                            <i data-lucide="arrow-right" class="w-4 h-4 transition-transform group-hover/btn:translate-x-1"></i>
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderGrid(items) {
            const container = document.getElementById('news-grid');
            if (items.length === 0) {
                 // Eğer manşet harici haber kalmadıysa boş bırakma, en azından bir mesaj veya boşluk olabilir
                 return;
            }

            items.forEach(news => {
                const dateObj = new Date(news.date);
                const formattedDate = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

                const html = `
                    <article class="news-card bg-onyx-800 rounded-xl overflow-hidden border border-gray-800 group relative flex flex-col h-full cursor-pointer" onclick="openModal(${news.id})">
                        <div class="h-60 overflow-hidden relative flex-shrink-0">
                            <img src="${news.image}" alt="${news.title}" class="news-image w-full h-full object-cover">
                            <div class="absolute top-4 right-4 bg-onyx-900/80 backdrop-blur text-gray-200 text-xs font-bold px-3 py-1 rounded border border-gray-700">${news.category}</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="text-xs text-gold-500 font-mono mb-2 uppercase">${formattedDate}</div>
                            <h3 class="font-heading text-xl font-bold text-gray-100 mb-3 group-hover:text-gold-400 transition-colors line-clamp-2">
                                ${news.title}
                            </h3>
                            <p class="text-gray-400 text-sm mb-4 line-clamp-3 flex-grow">
                                ${news.summary}
                            </p>
                            <div class="text-sm font-bold text-white flex items-center gap-2 group-hover:text-gold-500 transition-colors mt-auto">
                                Devamını Oku
                                <span class="read-more-line h-[1px] w-4 bg-gold-500 transition-all duration-300 group-hover:w-8"></span>
                            </div>
                        </div>
                    </article>
                `;
                container.innerHTML += html;
            });
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-controls');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.className = `w-10 h-10 rounded border ${currentPage === 1 ? 'border-gray-800 text-gray-600 cursor-not-allowed' : 'border-gray-700 text-gray-400 hover:text-white hover:border-gold-500'} flex items-center justify-center transition-all`;
            prevBtn.innerHTML = '<i data-lucide="chevron-left" class="w-4 h-4"></i>';
            prevBtn.onclick = () => { if(currentPage > 1) changePage(currentPage - 1); };
            container.appendChild(prevBtn);

            // Page Numbers
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                if (i === currentPage) {
                    btn.className = 'w-10 h-10 rounded bg-gold-500 text-onyx-900 font-bold border border-gold-500 shadow-glow flex items-center justify-center';
                } else {
                    btn.className = 'w-10 h-10 rounded border border-gray-700 text-gray-400 hover:text-white hover:border-gold-500 font-bold transition-all flex items-center justify-center';
                }
                btn.innerText = i;
                btn.onclick = () => changePage(i);
                container.appendChild(btn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.className = `w-10 h-10 rounded border ${currentPage === totalPages ? 'border-gray-800 text-gray-600 cursor-not-allowed' : 'border-gray-700 text-gray-400 hover:text-white hover:border-gold-500'} flex items-center justify-center transition-all`;
            nextBtn.innerHTML = '<i data-lucide="chevron-right" class="w-4 h-4"></i>';
            nextBtn.onclick = () => { if(currentPage < totalPages) changePage(currentPage + 1); };
            container.appendChild(nextBtn);
        }

        function changePage(page) {
            currentPage = page;
            renderApp();
            // Gridin başına scroll et (Manşet sabit kalır, grid değişir)
            const gridTop = document.getElementById('news-grid').offsetTop - 100;
            window.scrollTo({ top: gridTop, behavior: 'smooth' });
        }

        // --- INIT ---
        renderApp();

    </script>
</body>
</html>
