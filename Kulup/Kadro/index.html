    <style>
        /* Scrollbar */
        html { scrollbar-width: thin; scrollbar-color: #52525b #18181b; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
        
        /* Nav & Gradient */
        .nav-item { position: relative; overflow: hidden; }
        .nav-item::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); transition: left 0.5s ease; }
        .nav-item:hover::before { left: 100%; }
        .nav-link-text { position: relative; z-index: 2; }
        .text-gradient-gold { background: linear-gradient(to bottom, #F4D03F 0%, #D4AF37 50%, #B7950B 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #D4AF37; }

        /* Pro Card */
        .pro-card { position: relative; overflow: hidden; border-radius: 1rem; background-color: #09090b; border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        .pro-card:hover { transform: translateY(-8px); border-color: rgba(212, 175, 55, 0.6); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15); }
        .pro-card-img-container { width: 100%; aspect-ratio: 3/4; position: relative; z-index: 10; overflow: hidden; }
        .pro-card-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.1); transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.5s ease; }
        .pro-card:hover .pro-card-img { transform: scale(1.1); filter: grayscale(0%) contrast(1); }
        .pro-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(9, 9, 11, 1) 10%, rgba(9, 9, 11, 0.7) 40%, rgba(9, 9, 11, 0) 100%); z-index: 20; opacity: 0.9; }
        .pro-card-number { position: absolute; top: -20px; right: -10px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 8rem; line-height: 1; color: rgba(255, 255, 255, 0.03); z-index: 5; transition: all 0.6s ease; pointer-events: none; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.05); }
        .pro-card:hover .pro-card-number { color: rgba(212, 175, 55, 0.05); -webkit-text-stroke: 1px rgba(212, 175, 55, 0.2); transform: scale(1.1) translateX(-10px); }
        .pro-card-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 1.5rem; z-index: 30; }
        .pro-line { height: 4px; width: 40px; background: linear-gradient(90deg, #D4AF37, #F4D03F); margin-top: 10px; border-radius: 2px; transition: width 0.5s ease; }
        .pro-card:hover .pro-line { width: 100%; box-shadow: 0 0 15px rgba(212, 175, 55, 0.8); }

        /* HUD Card */
        .hud-card { background: rgba(15, 15, 18, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        .hud-card:hover { border-color: rgba(212, 175, 55, 0.5); background: rgba(20, 20, 25, 0.9); transform: translateY(-2px); box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212,175,55,0.1); }
        .hud-corner { position: absolute; width: 8px; height: 8px; border-color: #D4AF37; transition: all 0.3s ease; }
        .hud-tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; }
        .hud-tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; }
        .hud-bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; }
        .hud-br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; }
        .hud-card:hover .hud-corner { width: 100%; height: 100%; opacity: 0.1; }

        /* RADAR CHART STYLES */
        .radar-chart-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 1rem auto;
            position: relative;
        }
        .radar-axis { stroke: rgba(255,255,255,0.15); stroke-width: 1; }
        .radar-web { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 1; }
        .radar-area { 
            fill: rgba(212, 175, 55, 0.25); 
            stroke: #F4D03F; 
            stroke-width: 3; 
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.7));
            animation: radarPulse 3s infinite alternate;
        }
        .radar-label {
            fill: #D4AF37;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-anchor: middle;
            text-shadow: 0 0 8px rgba(0,0,0,1);
            letter-spacing: 1px;
        }
        /* OVR (Overall) Text Style */
        .radar-ovr {
            font-family: 'Rajdhani', sans-serif;
            fill: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .radar-ovr-label {
            font-family: 'Rajdhani', sans-serif;
            fill: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        @keyframes radarPulse {
            from { stroke-width: 3; fill-opacity: 0.25; }
            to { stroke-width: 4; fill-opacity: 0.45; }
        }

        /* Circular & Segmented Bars */
        .circular-chart { display: block; margin: 0 auto; max-width: 90%; max-height: 250px; }
        .circle-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 3.5; }
        .circle { fill: none; stroke-width: 3.5; stroke-linecap: round; animation: progress 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.5)); }
        @keyframes progress { 0% { stroke-dasharray: 0 100; } }
        .seg-bar-container { display: flex; gap: 3px; width: 100%; height: 12px; margin-top: 12px; }
        .seg-bar { flex: 1; background: rgba(255,255,255,0.08); border-radius: 2px; transition: all 0.5s ease; transform: skewX(-20deg); }
        .seg-bar.active { background: #D4AF37; box-shadow: 0 0 8px rgba(212,175,55,0.4); }
        .seg-bar.active-high { background: #F4D03F; box-shadow: 0 0 12px rgba(244, 208, 63, 0.8); }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 300ms ease-out; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: all 200ms ease-in; }

        .bg-grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
    </style>
</head>

        // --- RADAR CHART GENERATOR ---
        function getRadarChart(stats) {
            const keys = Object.keys(stats);
            const values = Object.values(stats);
            
            // OVR (Ortalama Hesaplama)
            const average = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
            
            const width = 300;
            const height = 250;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 80;
            const angleSlice = (Math.PI * 2) / keys.length;

            // Arkaplan Hexagon (Webs)
            let webs = '';
            for (let i = 1; i <= 4; i++) {
                const r = radius * (i / 4);
                let points = '';
                for (let j = 0; j < keys.length; j++) {
                    const angle = j * angleSlice - Math.PI / 2;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    points += `${x},${y} `;
                }
                webs += `<polygon class="radar-web" points="${points}" />`;
            }

            // Eksenler ve Etiketler
            let axes = '';
            let labels = '';
            let dataPoints = '';

            for (let i = 0; i < keys.length; i++) {
                const angle = i * angleSlice - Math.PI / 2;
                
                // Eksen
                const x2 = centerX + radius * Math.cos(angle);
                const y2 = centerY + radius * Math.sin(angle);
                axes += `<line class="radar-axis" x1="${centerX}" y1="${centerY}" x2="${x2}" y2="${y2}" />`;

                // Etiketler
                const labelRadius = radius + 20;
                const lx = centerX + labelRadius * Math.cos(angle);
                const ly = centerY + labelRadius * Math.sin(angle);
                labels += `<text class="radar-label" x="${lx}" y="${ly + 5}">${keys[i]}</text>`;
                
                // Data Points
                const val = values[i];
                const rData = radius * (val / 100);
                const dx = centerX + rData * Math.cos(angle);
                const dy = centerY + rData * Math.sin(angle);
                dataPoints += `${dx},${dy} `;
            }

            return `
                <div class="radar-chart-container group cursor-crosshair">
                    <!-- Dönen Hexagon Arka Plan -->
                    <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
                        <svg viewBox="0 0 100 100" class="w-64 h-64 animate-spin-slow">
                            <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#D4AF37" stroke-width="0.5" />
                        </svg>
                    </div>

                    <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%">
                        ${webs}
                        ${axes}
                        <polygon class="radar-area" points="${dataPoints}" />
                        
                        <!-- Merkezdeki OVR Yazısı -->
                        <text class="radar-ovr" x="${centerX}" y="${centerY + 12}" text-anchor="middle" font-size="44" font-weight="900">${average}</text>
                        <text class="radar-ovr-label" x="${centerX}" y="${centerY - 25}" text-anchor="middle">GENEL GÜÇ</text>
                        
                        ${labels}
                    </svg>
                </div>
            `;
        }

        // --- OTHER GRAPHS ---
        function getCircularProgress(valueStr) {
            const num = parseFloat(valueStr.replace('%', ''));
            const percent = isNaN(num) ? 0 : num;
            const dashArray = `${percent}, 100`;
            return `
                <div class="relative w-32 h-32 md:w-36 md:h-36 group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 rounded-full border-2 border-white/5 shadow-[0_0_25px_rgba(212,175,55,0.1)]"></div>
                    <svg viewBox="0 0 36 36" class="circular-chart w-full h-full transform -rotate-90">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle stroke-gold-500" stroke-dasharray="${dashArray}" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center font-tech font-black text-white text-3xl tracking-wide drop-shadow-[0_0_10px_rgba(0,0,0,1)]">${valueStr}</div>
                </div>
            `;
        }

        function getSegmentedBar(val, max = 100) {
            let percent = (val / max) * 100;
            if(percent > 100) percent = 100;
            if(percent < 10) percent = 15;
            const totalSegments = 10;
            const filledSegments = Math.ceil((percent / 100) * totalSegments);
            let barsHTML = '';
            for (let i = 0; i < totalSegments; i++) {
                const isActive = i < filledSegments;
                const isHigh = i > 7 && isActive; 
                const activeClass = isActive ? (isHigh ? 'active-high' : 'active') : '';
                barsHTML += `<div class="seg-bar ${activeClass}"></div>`;
            }
            return `<div class="seg-bar-container">${barsHTML}</div>`;
        }

        function openPlayerModal(key) {
            const player = playerData[key];
            if (!player) return;

            modalImg.src = player.img;
            modalName.innerText = player.name;
            modalRole.innerText = player.role;
            modalBigNumber.innerText = player.number;
            
            // 1. Radar Grafiğini Ekle
            if(player.fifaStats) {
                modalRadarContainer.innerHTML = getRadarChart(player.fifaStats);
            } else {
                modalRadarContainer.innerHTML = '';
            }

            // 2. Diğer İstatistikleri Ekle
            modalStatsGrid.innerHTML = '';
            player.stats.forEach((stat, index) => {
                const isPercentage = stat.value.includes('%');
                const numericValue = parseFloat(stat.value.replace(/[^0-9.]/g, '')) || 0;
                let contentHTML = '';
                
                if (isPercentage) {
                    contentHTML = `
                        <div class="flex flex-col items-center justify-center relative z-10 w-full h-full py-4">
                            ${getCircularProgress(stat.value)}
                            <div class="mt-4 text-base md:text-lg font-tech text-gold-400 font-bold uppercase tracking-[0.2em] text-center drop-shadow-md">${stat.label}</div>
                        </div>
                    `;
                } else {
                    let maxVal = 100;
                    if(stat.label.includes('Maç')) maxVal = 500;
                    else if(stat.label.includes('Gol')) maxVal = 50; 
                    else if(stat.label.includes('Asist')) maxVal = 30;
                    else if(stat.label.includes('Hız')) maxVal = 38;
                    else if(stat.label.includes('Puan')) maxVal = 3; 

                    // Dinamik Font Boyutu ve Wrap Koruması (Düzeltme Burda)
                    const isLongText = stat.value.length > 4;
                    const fontSizeClass = isLongText ? "text-4xl md:text-5xl" : "text-6xl md:text-7xl";

                    contentHTML = `
                        <div class="relative z-10 w-full flex flex-col justify-between h-full">
                            <div class="flex items-center justify-between mb-2">
                                <div class="text-sm md:text-base font-tech text-gray-400 font-bold uppercase tracking-[0.2em]">${stat.label}</div>
                            </div>
                            <div>
                                <div class="${fontSizeClass} font-tech font-black text-white tracking-tighter drop-shadow-lg leading-none whitespace-nowrap">${stat.value}</div>
                                ${getSegmentedBar(numericValue, maxVal)}
                            </div>
                        </div>
                    `;
                }

                const statCard = `
                    <div class="hud-card p-6 rounded-xl group flex items-center justify-center opacity-0 animate-[fadeInUp_0.5s_ease-out_forwards]" style="animation-delay: ${index * 80}ms;">
                        <div class="hud-corner hud-tl"></div>
                        <div class="hud-corner hud-tr"></div>
                        <div class="hud-corner hud-bl"></div>
                        <div class="hud-corner hud-br"></div>
                        ${contentHTML}
                    </div>
                `;
                modalStatsGrid.innerHTML += statCard;
            });

            // Animasyon CSS
            if(!document.getElementById('dynamic-anims')) {
                const style = document.createElement('style');
                style.id = 'dynamic-anims';
                style.innerHTML = `
                    @keyframes fadeInUp {
                        from { opacity: 0; transform: translateY(20px); }
                        to { opacity: 1; transform: translateY(0); }
                    }
                `;
                document.head.appendChild(style);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modalContent.classList.remove('modal-exit', 'modal-exit-active');
            modalContent.classList.add('modal-enter-active');
        }

        function closePlayerModal() {
            modalContent.classList.remove('modal-enter-active');
            modalContent.classList.add('modal-exit-active');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") closePlayerModal();
        });
